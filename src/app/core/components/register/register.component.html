
<div class="mt-10 p-6 max-w-md mx-auto bg-white dark:bg-slate-800 shadow-lg rounded-xl">
    <h4 class="py-4 text-slate-800 dark:text-white text-xl text-center font-semibold border-b border-slate-200 dark:border-slate-700">Register</h4>
    <div class="mt-5">
        <form>
            <div class="flex flex-col md:flex-row">
                <div class="mb-6">
                <label for="firstname" class="block mb-2 text-sm font-medium text-slate-700 dark:text-slate-200">First Name</label>
                <input type="text" id="firstname" class="shadow-sm bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5 outline-none" placeholder="David" required>
                </div>
                <div class="mb-6">
                <label for="lastname" class="block mb-2 text-sm font-medium text-slate-700 dark:text-slate-200">Last Name</label>
                <input type="text" id="lastname" class="shadow-sm bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5 outline-none" placeholder="Paul" required>
                </div>
            </div>
            <div class="mb-6">
                <label for="email" class="block mb-2 text-sm font-medium text-slate-700 dark:text-slate-200">Email</label>
                <input type="email" id="email" class="shadow-sm bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5 outline-none" placeholder="davidpaul@test.com" required>
              </div>
              <div class="mb-6">
                <label for="password" class="block mb-2 text-sm font-medium text-slate-700 dark:text-slate-200">Password</label>
                <input type="password" id="password" class="shadow-sm bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5 outline-none" required>
              </div>
            <div class="mb-6">
              <label for="repeat-password" class="block mb-2 text-sm font-medium text-slate-700 dark:text-slate-200">Repeat password</label>
              <input type="password" id="repeat-password" class="shadow-sm bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5 outline-none" required>
            </div>
            <div class="flex items-start mb-6">
              <div class="flex items-center h-5">
                <input id="terms" type="checkbox" value="" class="w-4 h-4 border border-slate-300 rounded bg-white dark:bg-slate-900 focus:ring-3 focus:ring-indigo-500 dark:border-slate-600" required>
              </div>
              <label for="terms" class="ml-2 text-sm font-medium text-slate-700 dark:text-slate-300">I agree with the <a href="#" class="text-slate-600 hover:underline dark:text-slate-400">terms and conditions</a></label>
            </div>
            <button type="submit" class="text-white bg-indigo-600 hover:bg-indigo-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 font-medium text-sm px-5 py-3 text-center w-full rounded-lg">Register </button>
            <p class="mt-4 text-sm">
                Already a member
                <a [routerLink]="['/login']" class="text-slate-600 hover:underline dark:text-slate-400">Login</a>
            </p>
          </form>
    </div>

</div>
