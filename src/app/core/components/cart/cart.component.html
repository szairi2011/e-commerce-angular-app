<section>
    <h3 class="text-3xl font-semibold text-slate-800 dark:text-white text-center mb-6">
        <i title="Shopping Cart" class="fa-solid fa-bag-shopping mr-2"></i>
        My Cart
    </h3>
    <ng-template #empty>
        <section class="flex justify-center items-center h-[60vh]">
            <div class="text-slate-500 dark:text-slate-400 flex flex-col justify-center items-center">
            <span class="text-4xl">
                <i class="fa-solid fa-bag-shopping"></i>
            </span>
            <h4 class="text-2xl px-4 py-2">NO ITEMS IN CART</h4>
            <a [routerLink]="['/']" 
            class="px-4 py-2 mt-5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
                Go to Shopping
            </a>
        </div>
        </section>
    </ng-template>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-3 gap-6 h-full" *ngIf="cart.length>0; else empty">
    <article class="col-span-1 md:col-span-2 ">
        <div class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 overflow-y-auto h-[480px] p-2">
            <app-cartitem 
            *ngFor="let item of cart"
            [item]="item"
            >
            </app-cartitem>
        </div>
       
        <div class="flex justify-between pt-3 text-slate-700 dark:text-slate-200">
            <div class="text-lg font-semibold">Items: {{cart.length}}</div>
            <div class="text-lg font-semibold">Total: <span class="ml-2">&#8377;{{total}}</span></div>
        </div>
    </article>
    <article class="col-span-1 mb-4">
        <div class="flex flex-col rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-4">
            <div class="flex-1">
                <label for="promo-code" class="font-semibold text-slate-700 dark:text-slate-200">Enter promo code</label>
                <div class="mt-2 flex flex-1 sm:flex-col lg:flex-row rounded-lg border border-slate-300 dark:border-slate-600 overflow-hidden">
                    <input type="text" name="promo-code" class="p-3 w-full bg-white dark:bg-slate-900 dark:text-slate-200 outline-none">
                    <button type="submit" class="px-6 py-3 text-center text-white bg-indigo-600 hover:bg-indigo-700">Apply</button>
                </div>
            </div>
            <div>
            <div class="mt-8 text-slate-700 dark:text-slate-200">
                <div class="flex justify-between pb-3">
                    <div>
                        <span class="text-xl">Shipping Cost</span>
                    </div>
                    <div class="text-right">
                        <span class="text-xl">&#8377;0.00</span>
                    </div>
                </div>
                <div class="flex justify-between pb-3">
                    <div>
                        <span class="text-xl">Discount</span>
                    </div>
                    <div class="text-right">
                        <span class="text-xl">&#8377;0.00</span>
                    </div>
                </div>
                <div class="flex justify-between pb-3">
                    <div>
                        <span class="text-xl">GST(18%)</span>
                    </div>
                    <div class="text-right">
                        <span class="text-xl">{{gstAmount}}</span>
                    </div>
                </div>

                <div class="flex justify-between pt-8">
                    <div>
                        <span class="text-2xl font-semibold">Estimated Total</span>
                    </div>
                    <div class="text-right">
                        <span class="text-2xl font-semibold">&#8377;{{estimatedTotal}}</span>
                    </div>
                </div>

            </div>
                
            </div>
            <div class="flex justify-center mt-10">
                <button 
                type="submit" 
                (click)="goToCheckout()"
                class="w-[80%] px-10 py-3 text-center font-semibold text-white rounded-lg bg-indigo-600 hover:bg-indigo-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
                    <i class="fa-solid fa-lock mr-2"></i>
                    Checkout
                </button>
            </div>
        </div>
    </article>
    </div>
</section>
