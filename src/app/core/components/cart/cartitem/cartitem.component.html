<div class="grid grid-cols-3 lg:grid-cols-5 bg-white dark:bg-slate-800 gap-2 border-b border-slate-200 dark:border-slate-700 p-3 rounded-lg">
    <div class="col-span-1 lg:col-span-1">
        <div class="relative flex flex-row justify-between mx-auto md:flex-col max-w-sm">
            <img class="rounded-lg object-cover" 
            [src]="item.images[0]" 
            [alt]="item.title" />
        </div>
    </div>
    <div class="col-span-2 lg:col-span-2 pt-2 pr-2">
        <p 
        class="font-semibold text-slate-800 dark:text-slate-100 text-ellipsis overflow-hidden whitespace-nowrap" 
        [title]="item.title">
        {{item.title}}
        </p>
        <p 
        class="text-sm text-slate-600 dark:text-slate-300 text-ellipsis overflow-hidden whitespace-nowrap"
        [title]="item.description"
        >
            {{item.description}}
        </p>
        <p class="text-sm" *ngIf="item.size">Size: {{item&&item.size}}</p>
        <p class="text-sm">
            <span class="text-slate-700 dark:text-slate-300 mr-2">Product: {{item.type}}</span>
            <span class="font-semibold text-emerald-600" *ngIf="item.stock=='In stock'">{{item.stock}}</span> 
            <span class="font-semibold text-amber-600" *ngIf="item.stock=='Out of stock'">{{item.stock}}</span> 
        </p>

        <p class="font-semibold text-slate-900 dark:text-white">&#8377;{{item.price}}</p>
        <div class="flex justify-start items-center mt-4">
            <button class="px-3 py-1 rounded-l-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200" aria-label="less quantity" (click)="lessQty(item)">
                <i class="fa-solid fa-minus"></i>
            </button>
            <span class="py-1 w-[40px] text-center">{{item.qty}}</span>
            <button class="px-3 py-1 rounded-r-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200" aria-label="add quantity" (click)="addQty(item)">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
            <!-- <button class="px-3 py-1 font-semibold bg-gray-600 text-white rounded">
                Save
                <i class="fa-solid fa-heart"></i>
            </button> -->

    </div>
    <div class="col-span-3 lg:col-span-2 flex justify-between flex-1 lg:items-end flex-row lg:flex-col gap-2">        
        <div class="order-2 lg:order-1 text-right">
            <p class="font-semibold text-slate-700 dark:text-slate-200">Total</p>
            <div class="">
                <span class="text-lg text-emerald-600 font-semibold">&#8377;{{item.totalprice}}</span>
            </div>
        </div>

        <div class="action text-sm order-1 lg:order-2 ">
            <button class="px-3 py-1 m-3 font-semibold rounded-lg bg-rose-100 text-rose-700 hover:bg-rose-200 dark:bg-rose-400/10 dark:text-rose-300 dark:hover:bg-rose-400/20" (click)="removeFromCart(item)">
                <i class="fa-solid fa-trash"></i>
                Remove
            </button>

            <button class="px-3 py-1 m-3 font-semibold rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-white/10 dark:text-slate-300 dark:hover:bg-white/20">
                <i class="fa-solid fa-heart"></i>
                Save
            </button>
        </div>
       
    </div>
    <!--  -->
</div>
