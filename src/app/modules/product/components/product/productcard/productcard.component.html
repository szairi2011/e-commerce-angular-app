<div class="group relative mx-auto w-full max-w-md overflow-hidden rounded-xl bg-white ring-1 ring-black/5 shadow-sm transition hover:shadow-md dark:bg-slate-800 dark:ring-white/10">
        <a [routerLink]="['/categories','product',product.id]" class="block overflow-hidden">
            <div class="aspect-[4/5] bg-slate-100 dark:bg-slate-700 overflow-hidden">
              <img 
              class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
              [ngClass]="{'grayscale':product.stock=='Out of stock'}" 
              [src]="product.images[0]" 
              [alt]="product.title" />
            </div>
        </a>
        
        <div class="p-4 md:p-5">
            <a [routerLink]="['/categories','product',product.id]">
                <h5 class="mb-2 text-sm font-semibold tracking-tight text-slate-900 dark:text-slate-100 line-clamp-2">{{product.title | slice:0:60}}...</h5>
            </a>
            <p class="text-sm text-slate-700 dark:text-slate-300">
               <span class="mr-3 text-base font-semibold text-slate-900 dark:text-white">&#8377;{{product.price}}</span> 
               <span class="mr-3 line-through" *ngIf="product.prevprice!=0">&#8377;{{product.prevprice}}</span> 
               <span class="text-xs font-bold text-rose-600" *ngIf="product.prevprice!==0">(-{{discount}}%)</span> 
            </p>
            
            <p class="mt-1 flex items-center text-slate-600 dark:text-slate-300">
                <span class="mr-1.5">{{product.rating.rate}}</span>
                <span *ngFor="let ratestar of ratingList">
                    <i class="fa-solid fa-star" *ngIf="ratestar"></i>
                  </span>
                  <span *ngFor="let ratestar of ratingList">
                    <i class="fa-regular fa-star" *ngIf="!ratestar" ></i>
                  </span>
                <span class="ml-2 text-xs">({{product.rating.count}})</span>
            </p>
            
            <button 
            *ngIf="isProductInCart(product); else addtocart"
            class="mt-3 inline-flex w-full items-center justify-center rounded-lg bg-rose-600 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose-500"
            aria-label="Remove from Cart"
            (click)="removeFromCart(product)"
            >
            <i class="fa-solid fa-trash mr-2"></i>
            Remove
            </button>

            <ng-template #addtocart>
                <button 
                class="mt-3 inline-flex w-full items-center justify-center rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
                aria-label="Add to Cart"
                (click)="addToCart(product)"
                *ngIf="product.stock=='In stock'"
                >
                    <i title="Shopping Cart" class="fa-solid fa-bag-shopping mr-2"></i>
                    Add to Cart
                </button>

                <div 
                class="mt-3 w-full cursor-not-allowed rounded-lg bg-amber-500 px-4 py-2 text-center text-white"
                disabled
                aria-label="Available soon"
                *ngIf="product.stock=='Out of stock'"
                >Available soon
                </div>

            </ng-template>
            
            <div class="absolute top-3 left-3 md:right-3 flex justify-end gap-2 items-center">
                <span *ngIf="product.stock=='In stock'; else outofstock" class="rounded-full bg-emerald-600 px-2.5 py-1 text-center text-xs font-semibold text-white">
                    {{product.stock}}
                </span>
                <ng-template #outofstock>
                    <span class="rounded-full bg-amber-600 px-2.5 py-1 text-center text-xs font-semibold text-white" >
                    {{product.stock}}
                    </span>
                </ng-template>
                
                <button 
                aria-label="add to wishlist"
                class="grid h-9 w-9 place-items-center rounded-full border border-slate-200 bg-white text-slate-600 shadow-sm hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:bg-slate-800"
                title="Add to Wishlist"
                >
                    <i class="fa-regular fa-heart"></i>
                </button>
            </div>
            
        </div>
</div>
